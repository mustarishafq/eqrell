crons:
  - name: parent-digests
    description: "Sends parents their Niat Pagi, Laporan Malam and Sunday weekly report push at their chosen times"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/digests"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
