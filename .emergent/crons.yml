crons:
  - name: parent-digests
    description: "Parent digests (Niat Pagi, Laporan Malam, weekly) + kids habit reminders at their exact times"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/digests"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
